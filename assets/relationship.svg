<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="24" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">The UI-UX Design Relationship</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="120" width="180" height="110" rx="18" fill="#ede9fe"/>
    <text x="130" y="165" font-size="20" font-weight="700" fill="#5b21b6">USER NEEDS</text>
    <text x="130" y="198" font-size="15" fill="#475569">Goals and problems</text>

    <rect x="270" y="120" width="180" height="110" rx="18" fill="#dcfce7"/>
    <text x="360" y="165" font-size="20" font-weight="700" fill="#166534">UX RESEARCH</text>
    <text x="360" y="198" font-size="15" fill="#475569">Understand users</text>

    <rect x="500" y="120" width="180" height="110" rx="18" fill="#dcfce7"/>
    <text x="590" y="165" font-size="20" font-weight="700" fill="#166534">UX STRUCTURE</text>
    <text x="590" y="198" font-size="15" fill="#475569">Flows and wireframes</text>

    <rect x="730" y="120" width="180" height="110" rx="18" fill="#dbeafe"/>
    <text x="820" y="165" font-size="20" font-weight="700" fill="#1e40af">UI DESIGN</text>
    <text x="820" y="198" font-size="15" fill="#475569">Visual interface</text>

    <rect x="960" y="120" width="200" height="110" rx="18" fill="#ffedd5"/>
    <text x="1060" y="165" font-size="20" font-weight="700" fill="#c2410c">PROTOTYPE</text>
    <text x="1060" y="198" font-size="15" fill="#475569">Test and improve</text>
  </g>

  <line x1="220" y1="175" x2="260" y2="175" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="175" x2="490" y2="175" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="680" y1="175" x2="720" y2="175" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="910" y1="175" x2="950" y2="175" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="250" y="300" width="700" height="72" rx="36" fill="#0f172a"/>
  <text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">UX decides what • UI decides how • Testing improves both</text>
</svg>
